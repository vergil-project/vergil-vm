# vergil-agent — Identity VM for Vergil agent sessions.
#
# Creates an Ubuntu 24.04 VM with rootless containerd, core
# development tools, and dynamic vergil-tooling installation.
#
# The projects mount is required — override HOST_PROJECTS_DIR
# with --set before creating the VM:
#
#   limactl create --name=vergil-agent templates/agent.yaml \
#     --set='.mounts[0].location = "/absolute/path/to/projects"' \
#     --tty=false
#   limactl start vergil-agent
#
# Reference:
#   docs/specs/2026-05-20-identity-vm-isolation-design.md
#   docs/specs/2026-05-20-vergil-vm-image-management-design.md

minimumLimaVersion: "2.0.0"

base:
- template:_images/ubuntu-lts

# Resource allocation — conservative defaults for modest hardware.
#
# Override per-identity in ~/.config/vergil/identities.toml:
#   cpus = 12
#   memory = "32GiB"
#   disk = "100GiB"
#
# Or at create time:  limactl create ... --set='.cpus = N' --set='.memory = "XGiB"'
# On a stopped VM:    limactl edit <instance>
cpus: 4
memory: "4GiB"
disk: "50GiB"

containerd:
  system: false
  user: true

mounts:
- location: "HOST_PROJECTS_DIR"
  mountPoint: "/projects"
  writable: true

ssh:
  forwardAgent: false

provision:
# systemd-logind busy-loops at 100% CPU polling VT fds under this VM's
# virtual console hardware, which starves D-Bus and hangs every PAM login
# (including the `sudo -i` in Lima's rootless-containerd setup), wedging
# cloud-init and leaving `limactl start` stuck at "Starting VM...".
# Disabling VT management stops the spin. mode:boot runs in cloud-init's
# init stage, before the built-in boot.Linux containerd script.
- mode: boot
  script: |
    set -eu
    mkdir -p /etc/systemd/logind.conf.d
    printf '[Login]\nNAutoVTs=0\nReserveVT=0\n' \
      > /etc/systemd/logind.conf.d/10-vergil-novt.conf
    if systemctl is-active --quiet systemd-logind 2>/dev/null; then
      systemctl try-restart systemd-logind || true
    fi

- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    apt-get update
    apt-get install -y --no-install-recommends \
      curl wget unzip \
      jq ripgrep fzf \
      zsh vim tmux nano \
      python3 python3-venv

    # GitHub CLI
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
    chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    apt-get update
    apt-get install -y gh

    # Node.js (required for Claude Code)
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs

    # yq (not in Ubuntu repos — install from GitHub releases)
    ARCH=$(dpkg --print-architecture)
    curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" \
      -o /usr/local/bin/yq
    chmod +x /usr/local/bin/yq

    # Claude Code (npm global install requires root)
    npm install -g @anthropic-ai/claude-code

    # Set zsh as default shell for the Lima user
    chsh -s /bin/zsh "{{.User}}"

    # sshd: accept terminal env vars so Claude Code detects keyboard
    # protocol support when accessed over SSH
    cat > /etc/ssh/sshd_config.d/10-acceptenv-terminal.conf << 'SSHD_CONF'
    AcceptEnv COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION
    SSHD_CONF

    apt-get clean
    rm -rf /var/lib/apt/lists/*

# PATH for non-login, non-interactive shells. uv and uv-installed vergil
# tooling land in ~/.local/bin, which Claude Code's non-interactive shells
# (e.g. `limactl shell -- ...`) must resolve. Those shells don't source
# ~/.zshrc or /etc/profile.d — their PATH comes solely from /etc/environment
# via PAM (pam_env). So prepend ~/.local/bin there. pam_env does NOT expand
# $HOME, and Lima may suffix the home dir (e.g. <user>.guest), so resolve the
# real home with getent rather than assuming /home/{{.User}}. Also drop the
# now-stale /snap/bin (snapd is purged in the minimization step below).
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    USER_HOME="$(getent passwd "{{.User}}" | cut -d: -f6)"
    sed -i "s|^PATH=.*|PATH=\"${USER_HOME}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games\"|" /etc/environment

    # Disable Claude Code's background autoupdater image-wide (issue #85). The
    # npm global prefix is root-owned but sessions run as the non-root Lima
    # user, so the background update can't write there and spams the status
    # line every session. Writing it to /etc/environment lets PAM (pam_env)
    # apply it to every login session, including SSH and `limactl shell`. We
    # use DISABLE_AUTOUPDATER, not DISABLE_UPDATES, so a deliberate
    # `claude update` still works — only the failing background attempt is
    # suppressed. Version control of Claude Code stays deliberate via rebuild.
    grep -q '^DISABLE_AUTOUPDATER=' /etc/environment \
      || echo 'DISABLE_AUTOUPDATER=1' >> /etc/environment

# --- Service-surface minimization (issue #78) -------------------------------
# Strip the general-purpose Ubuntu default service set down to what this
# special-purpose agent VM needs. Mask-by-default (reversible, resists
# dependency pull-in) + a curated purge of dead-weight packages. The mask list
# is the reconciled "expanded" set from the baseline audit (see
# docs/specs/2026-05-31-vm-service-surface-minimization-design.md and the
# decision table on issue #78); it MUST match tests/test_services.sh exactly.
#
# KEEP (load-bearing — never mask): ssh, lima-* (limactl access),
#   containerd (user), cloud-init* (per-boot logind fix #74), dbus, journald,
#   logind, resolved, timesyncd, networkd/networkd-dispatcher, serial-getty,
#   polkit, apparmor, LVM/dm/storage (lvm2-monitor, dm-event, *.lvmpolld),
#   grub/boot/console units, and ALL netfilter*/iptables*/nftables*/ufw units
#   (reserved for egress filtering — vergil-tooling #901).
# MASK: VMware tools (open-vm-tools, vgauth — wrong hypervisor), iSCSI
#   (open-iscsi, iscsid), multipathd, udisks2, ModemManager, apport*, Ubuntu
#   Pro (ubuntu-advantage, ua-*), sysstat*, fwupd-refresh, mdadm (mdcheck*,
#   mdmonitor*), update-notifier*, lxd-installer, motd-news*, apt-daily*,
#   getty@tty1, systemd-networkd-wait-online.
# PURGE: snapd, unattended-upgrades.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    # MASK — unneeded units. The `systemctl cat` gate skips units this image
    # doesn't ship (so we don't create dead /dev/null links). For a unit that
    # IS present, `mask` is not allowed to fail silently: a gated unit should
    # always mask, so a failure is a real anomaly — let set -e abort the build
    # loudly rather than ship a VM with an unmasked unit we meant to strip.
    mask_if_present() {
      local u
      for u in "$@"; do
        if systemctl cat "$u" >/dev/null 2>&1; then
          systemctl mask "$u"
        fi
      done
    }

    mask_if_present \
      getty@tty1.service \
      ModemManager.service \
      multipathd.service multipathd.socket \
      udisks2.service \
      apport.service apport-forward.socket \
        apport-autoreport.path apport-autoreport.timer \
      open-iscsi.service iscsid.socket \
      open-vm-tools.service vgauth.service \
      sysstat.service sysstat-collect.timer sysstat-summary.timer \
      systemd-networkd-wait-online.service \
      ubuntu-advantage.service ua-reboot-cmds.service ua-timer.timer \
      fwupd-refresh.timer \
      mdcheck_continue.timer mdcheck_start.timer mdmonitor-oneshot.timer \
      update-notifier-download.timer update-notifier-motd.timer \
      lxd-installer.socket \
      motd-news.service motd-news.timer \
      apt-daily.timer apt-daily-upgrade.timer

    # PURGE — curated dead weight. Stop snapd first so purge is clean; the
    # stop keeps `|| true` because stopping an absent unit exits non-zero
    # (images without snapd). The purge/autoremove do NOT swallow errors:
    # apt-get exits 0 when there's nothing to remove, so `|| true` there would
    # only ever hide a genuine failure and ship a VM that still has snapd.
    # set -e then aborts provisioning visibly on a real purge failure.
    systemctl stop snapd.socket snapd.service 2>/dev/null || true
    apt-get purge -y snapd unattended-upgrades
    apt-get autoremove -y --purge

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail

    # Install uv (Python package manager)
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.local/bin:$PATH"
    uv --version

    # Minimal zsh configuration
    cat > "$HOME/.zshrc" << 'ZSHRC'
    export PATH="$HOME/.local/bin:$PATH"

    # Complement /etc/environment for interactive shells (issue #85).
    export DISABLE_AUTOUPDATER=1

    autoload -Uz compinit && compinit
    setopt HIST_IGNORE_DUPS
    setopt SHARE_HISTORY
    HISTFILE="$HOME/.zsh_history"
    HISTSIZE=10000
    SAVEHIST=10000

    # Prompt: user@hostname:dir$
    PROMPT='%n@%m:%~$ '
    ZSHRC

probes:
- mode: readiness
  description: "core tools installed and containerd running"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export PATH="$HOME/.local/bin:$PATH"
    timeout 1800 bash -c '
      until command -v gh >/dev/null 2>&1 &&
            command -v uv >/dev/null 2>&1 &&
            command -v claude >/dev/null 2>&1 &&
            pgrep -f containerd >/dev/null 2>&1; do
        sleep 5
      done
    '
  hint: |
    Check provisioning logs: limactl shell vergil-agent -- cat /var/log/cloud-init-output.log

message: |
  vergil-agent VM is ready.

  Projects mount: /projects

  Shell into the VM:
    limactl shell {{.Name}}

  Run nerdctl:
    limactl shell {{.Name}} -- nerdctl run --rm alpine echo hello

  Launch Claude Code:
    limactl shell {{.Name}} --workdir /projects -- claude

  Install vergil-tooling:
    limactl shell {{.Name}} -- bash -c 'uv tool install "vergil-tooling @ git+https://github.com/vergil-project/vergil-tooling@v2.0"'
