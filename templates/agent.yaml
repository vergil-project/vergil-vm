# vergil-agent — Identity VM for Vergil agent sessions.
#
# Creates an Ubuntu 24.04 VM with rootless containerd, core
# development tools, and dynamic vergil-tooling installation.
#
# The projects mount is required — vrg-vm (vergil-tooling) drives this
# template and injects HOST_PROJECTS_DIR from the identity config at
# create time:
#
#   vrg-vm create
#   vrg-vm start
#
# Reference:
#   docs/specs/2026-05-20-identity-vm-isolation-design.md
#   docs/specs/2026-05-20-vergil-vm-image-management-design.md

minimumLimaVersion: "2.0.0"

base:
- template:_images/ubuntu-lts

# Resource allocation — conservative defaults for modest hardware.
#
# Override per-identity in ~/.config/vergil/identities.toml:
#   cpus = 12
#   memory = "32GiB"
#   disk = "100GiB"
#
# vrg-vm applies these at create time; apply a changed footprint to an
# existing VM with `vrg-vm rebuild`.
cpus: 4
memory: "4GiB"
disk: "50GiB"

# Per-repo VM profile parameters (issue #99). Overridden at create time by
# vrg-vm via `--set=.param.<KEY>`. Empty defaults keep the base box unchanged.
param:
  EXTRA_PACKAGES: ""          # space-separated apt package list, layered additively
  APT_REPOS: ""               # ";"-joined "name|key_url|uri|suite|components" records
  VAGRANT_PLUGINS: ""         # space-separated vagrant plugin names
  SPEC_FINGERPRINT: ""        # composed-spec fingerprint, stamped into the VM
  NESTED_VIRT: ""             # "true" when the composed spec declares nested = true
  PORT_FORWARDS: ""           # ";"-joined "port|host:port" relay records (issue #170)

# Nested virtualization (issue #131) — a per-profile knob, default OFF.
# `nestedVirtualization` is static top-level Lima/vz config, so a template
# cannot express "host permitting"; the consuming repo's spec drives it at
# create time instead. When the composed spec declares `nested = true`,
# vrg-vm sets BOTH halves together:
#
#   --set='.nestedVirtualization = true'
#   --set='.param.NESTED_VIRT = "true"'
#
# The flag makes Lima's vz driver expose virtualization extensions to the
# guest (so /dev/kvm appears); the param drives the in-guest verification
# step below, which fails the build loudly if /dev/kvm did not materialize.
# Requires macOS 15+ on M3-or-later Apple silicon — Lima itself rejects the
# flag at create/start on unsupported hosts. Default-off keeps the KVM API
# out of base agent VMs (service-surface minimization, issue #78).
nestedVirtualization: false

containerd:
  system: false
  user: true

mounts:
- location: "HOST_PROJECTS_DIR"
  mountPoint: "/projects"
  writable: true

ssh:
  forwardAgent: false

provision:
# systemd-logind busy-loops at 100% CPU polling VT fds under this VM's
# virtual console hardware, which starves D-Bus and hangs every PAM login
# (including the `sudo -i` in Lima's rootless-containerd setup), wedging
# cloud-init and leaving `limactl start` stuck at "Starting VM...".
# Disabling VT management stops the spin. mode:boot runs in cloud-init's
# init stage, before the built-in boot.Linux containerd script.
- mode: boot
  script: |
    set -eu
    mkdir -p /etc/systemd/logind.conf.d
    printf '[Login]\nNAutoVTs=0\nReserveVT=0\n' \
      > /etc/systemd/logind.conf.d/10-vergil-novt.conf
    if systemctl is-active --quiet systemd-logind 2>/dev/null; then
      systemctl try-restart systemd-logind || true
    fi

- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    # First-boot-only (#177). Lima re-runs every provisioning script on every
    # boot (cloud-init per-boot runparts — Lima rotates the instance-id each
    # boot to force it). These steps are network-bound; re-running them on a
    # reboot is slow (a full apt re-download, npm, curl installers) and, under
    # `set -e`, turns any transient apt/npm/registry timeout into a failed
    # boot. This box is rebuilt from scratch, never updated in place, so
    # install once and skip thereafter. The marker is stamped LAST (end of this
    # block), so a failed install never leaves the box marked provisioned.
    if [ -f /etc/vergil/provisioned.base ]; then exit 0; fi

    apt-get update
    apt-get install -y --no-install-recommends \
      curl wget unzip \
      jq ripgrep fzf \
      zsh vim tmux nano \
      python3 python3-venv \
      chrony

    # chrony — reliable, suspend-resilient time + NTP authority for nested
    # libvirt guests (issue #187). Installed here (network-bound, first-boot
    # only); its config + the timesyncd handoff + optional NTP serving are
    # written by the dedicated time block near the end of provisioning, which
    # runs every boot so the serving decision tracks the current profile.

    # GitHub CLI
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
    chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    apt-get update
    apt-get install -y gh

    # Node.js (required for Claude Code)
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs

    # yq (not in Ubuntu repos — install from GitHub releases)
    ARCH=$(dpkg --print-architecture)
    curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" \
      -o /usr/local/bin/yq
    chmod +x /usr/local/bin/yq

    # Claude Code (npm global install requires root)
    npm install -g @anthropic-ai/claude-code

    # Set zsh as default shell for the Lima user
    chsh -s /bin/zsh "{{.User}}"

    # sshd: accept terminal env vars so Claude Code detects keyboard
    # protocol support when accessed over SSH
    cat > /etc/ssh/sshd_config.d/10-acceptenv-terminal.conf << 'SSHD_CONF'
    AcceptEnv COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION
    SSHD_CONF

    # Keep the apt lists cache — do NOT `rm -rf /var/lib/apt/lists/*`. This box
    # is rebuilt from scratch, so per-boot cache hygiene buys nothing; the wipe
    # only forced the next boot's apt-get update to re-fetch ~46 MB of indices
    # (#177). apt-get clean (downloaded .debs) stays — it never forces a
    # re-download of the lists.
    apt-get clean

    # Stamp the first-boot completion marker LAST, only after every install
    # above succeeded (#177).
    mkdir -p /etc/vergil
    touch /etc/vergil/provisioned.base

# PATH for non-login, non-interactive shells. uv and uv-installed vergil
# tooling land in ~/.local/bin, which Claude Code's non-interactive shells
# (e.g. `limactl shell -- ...`) must resolve. Those shells don't source
# ~/.zshrc or /etc/profile.d — their PATH comes solely from /etc/environment
# via PAM (pam_env). So prepend ~/.local/bin there. pam_env does NOT expand
# $HOME, and Lima may suffix the home dir (e.g. <user>.guest), so resolve the
# real home with getent rather than assuming /home/{{.User}}. Also drop the
# now-stale /snap/bin (snapd is purged in the minimization step below).
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    USER_HOME="$(getent passwd "{{.User}}" | cut -d: -f6)"
    sed -i "s|^PATH=.*|PATH=\"${USER_HOME}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games\"|" /etc/environment

    # Disable Claude Code's background autoupdater image-wide (issues #85,
    # #110). The npm global prefix is root-owned but sessions run as the
    # non-root Lima user, so the background update can't write there and
    # spams the status line every session.
    #
    # The authoritative mechanism is managed settings: Claude Code reads
    # /etc/claude-code/managed-settings.json from disk at process start, so
    # it applies on every spawn path. The /etc/environment line below is NOT
    # sufficient on its own (issue #110): pam_env snapshots the file once,
    # when an SSH session opens, and Lima's ControlMaster multiplexing reuses
    # that single PAM environment for every later `limactl shell` channel —
    # a master connection opened before this script appends the line never
    # sees it. Claude Code is also spawned as a direct child of sshd (no
    # shell, SHLVL=0), so the ~/.zshrc export never runs on that path. The
    # env line stays as defense in depth for tooling that inspects the
    # variable directly.
    #
    # We use DISABLE_AUTOUPDATER, not DISABLE_UPDATES, so a deliberate
    # `claude update` still works — only the failing background attempt is
    # suppressed. Version control of Claude Code stays deliberate via rebuild.
    mkdir -p /etc/claude-code
    cat > /etc/claude-code/managed-settings.json << 'JSON'
    {
      "env": {
        "DISABLE_AUTOUPDATER": "1"
      }
    }
    JSON
    chmod 644 /etc/claude-code/managed-settings.json
    grep -q '^DISABLE_AUTOUPDATER=' /etc/environment \
      || echo 'DISABLE_AUTOUPDATER=1' >> /etc/environment

# --- Service-surface minimization (issue #78) -------------------------------
# Strip the general-purpose Ubuntu default service set down to what this
# special-purpose agent VM needs. Mask-by-default (reversible, resists
# dependency pull-in) + a curated purge of dead-weight packages. The mask list
# is the reconciled "expanded" set from the baseline audit (see
# docs/specs/2026-05-31-vm-service-surface-minimization-design.md and the
# decision table on issue #78); it MUST match tests/test_services.sh exactly.
#
# KEEP (load-bearing — never mask): ssh, lima-* (limactl access),
#   containerd (user), cloud-init* (per-boot logind fix #74), dbus, journald,
#   logind, resolved, networkd/networkd-dispatcher, serial-getty,
#   polkit, apparmor, LVM/dm/storage (lvm2-monitor, dm-event, *.lvmpolld),
#   grub/boot/console units, and ALL netfilter*/iptables*/nftables*/ufw units
#   (reserved for egress filtering — vergil-tooling #901).
# NOTE: systemd-timesyncd is NOT kept — chrony owns the clock now (issue #187),
#   and the time block below masks timesyncd so the two daemons never duel.
# MASK: VMware tools (open-vm-tools, vgauth — wrong hypervisor), iSCSI
#   (open-iscsi, iscsid), multipathd, udisks2, ModemManager, apport*, Ubuntu
#   Pro (ubuntu-advantage, ua-*), sysstat*, fwupd-refresh, mdadm (mdcheck*,
#   mdmonitor*), update-notifier*, lxd-installer, motd-news*, apt-daily*,
#   getty@tty1, systemd-networkd-wait-online.
# PURGE: snapd, unattended-upgrades.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    # MASK — unneeded units. The `systemctl cat` gate skips units this image
    # doesn't ship (so we don't create dead /dev/null links). For a unit that
    # IS present, `mask` is not allowed to fail silently: a gated unit should
    # always mask, so a failure is a real anomaly — let set -e abort the build
    # loudly rather than ship a VM with an unmasked unit we meant to strip.
    mask_if_present() {
      local u
      for u in "$@"; do
        if systemctl cat "$u" >/dev/null 2>&1; then
          systemctl mask "$u"
        fi
      done
    }

    mask_if_present \
      getty@tty1.service \
      ModemManager.service \
      multipathd.service multipathd.socket \
      udisks2.service \
      apport.service apport-forward.socket \
        apport-autoreport.path apport-autoreport.timer \
      open-iscsi.service iscsid.socket \
      open-vm-tools.service vgauth.service \
      sysstat.service sysstat-collect.timer sysstat-summary.timer \
      systemd-networkd-wait-online.service \
      ubuntu-advantage.service ua-reboot-cmds.service ua-timer.timer \
      fwupd-refresh.timer \
      mdcheck_continue.timer mdcheck_start.timer mdmonitor-oneshot.timer \
      update-notifier-download.timer update-notifier-motd.timer \
      lxd-installer.socket \
      motd-news.service motd-news.timer \
      apt-daily.timer apt-daily-upgrade.timer

    # PURGE — curated dead weight. Stop snapd first so purge is clean; the
    # stop keeps `|| true` because stopping an absent unit exits non-zero
    # (images without snapd). The purge/autoremove do NOT swallow errors:
    # apt-get exits 0 when there's nothing to remove, so `|| true` there would
    # only ever hide a genuine failure and ship a VM that still has snapd.
    # set -e then aborts provisioning visibly on a real purge failure.
    systemctl stop snapd.socket snapd.service 2>/dev/null || true
    apt-get purge -y snapd unattended-upgrades
    apt-get autoremove -y --purge

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail

    # First-boot-only (#177). Lima's user-phase provisioning, re-run on every
    # boot; skip the network install and the rc-file writes once done. The
    # marker is user-owned — this phase runs as the Lima user and /etc/vergil
    # is root-owned — and is stamped LAST so a partial run (uv installed but
    # rc files not yet written) re-runs on the next boot.
    if [ -f "$HOME/.vergil/provisioned.uv" ]; then exit 0; fi

    # Install uv (Python package manager)
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.local/bin:$PATH"
    uv --version

    # Minimal zsh configuration
    cat > "$HOME/.zshrc" << 'ZSHRC'
    export PATH="$HOME/.local/bin:$PATH"

    # Belt-and-suspenders for interactive shells (issues #85, #110). The
    # authoritative disable is /etc/claude-code/managed-settings.json —
    # Claude Code is usually spawned with no shell at all, so this export
    # never reaches it on that path.
    export DISABLE_AUTOUPDATER=1

    autoload -Uz compinit && compinit

    # Generic, least-surprise interactive defaults (issue #171). Only
    # conventional settings a normal zsh user would expect — no idiosyncratic
    # or behavior-changing options. These affect interactive human sessions
    # only; agents run shell-less or via non-interactive bash and never source
    # this file. No ~/.zshrc.local override hook: the VM has no mechanism to
    # provision such a file, so a dangling `source` line would only invite
    # manual editing of VM contents. A personal-customization story is deferred
    # until there is a real host-side provisioning mechanism to pair with it.

    # --- Interactive papercuts ---
    # IGNORE_EOF: Ctrl-D no longer drops the shell mid-session; type `exit` to
    #   leave. zsh's option is all-or-nothing (no bash-style press-N-times
    #   count). INTERACTIVE_COMMENTS: honor `#` on the command line so pasting a
    #   command with a trailing `# comment` runs instead of erroring. BEEP: kill
    #   the terminal bell.
    setopt IGNORE_EOF
    setopt INTERACTIVE_COMMENTS
    unsetopt BEEP

    # --- History ---
    setopt HIST_IGNORE_DUPS
    setopt SHARE_HISTORY
    setopt EXTENDED_HISTORY        # timestamp each entry
    setopt HIST_IGNORE_SPACE      # leading-space commands stay out of history
    setopt HIST_REDUCE_BLANKS     # normalize whitespace before saving
    setopt HIST_FIND_NO_DUPS      # history search skips repeats
    HISTFILE="$HOME/.zsh_history"
    HISTSIZE=50000
    SAVEHIST=50000

    # --- Navigation ---
    # cd maintains a directory stack; invisible unless you reach for `cd -<TAB>`.
    setopt AUTO_PUSHD PUSHD_IGNORE_DUPS PUSHD_SILENT

    # --- Completion ---
    setopt COMPLETE_IN_WORD
    zstyle ':completion:*' matcher-list 'm:{a-zA-Z}={A-Za-z}'   # case-insensitive
    zstyle ':completion:*' list-colors "${(s.:.)LS_COLORS}"     # colored menu

    # --- Globbing & misc ---
    setopt EXTENDED_GLOB
    export LESS=-R
    alias ls='ls --color=auto'    # benign: adds color, changes no semantics

    # --- Keybinding correctness over SSH/tmux ---
    # Home / End / Delete / Ctrl-Left / Ctrl-Right are frequently broken under
    # SSH and tmux. Bind the common escape sequences explicitly; this fixes
    # broken keys rather than changing behavior.
    bindkey '^[[H'    beginning-of-line       # Home
    bindkey '^[[F'    end-of-line             # End
    bindkey '^[[1~'   beginning-of-line       # Home (rxvt/linux console)
    bindkey '^[[4~'   end-of-line             # End  (rxvt/linux console)
    bindkey '^[[3~'   delete-char             # Delete
    bindkey '^[[1;5C' forward-word            # Ctrl-Right
    bindkey '^[[1;5D' backward-word           # Ctrl-Left

    # Prompt: identity-colored role + working dir on two lines (issue #153).
    # Only the role token is colored, so "which agent am I" is a pre-attentive
    # glance. Identity comes from VRG_IDENTITY_MODE (set in ~/.zshenv before
    # this runs); it never changes within a VM, so we bake the value/color at
    # init rather than re-evaluating per prompt. The path stays literal (%~
    # shows a tilde only when genuinely in $HOME).
    case "${VRG_IDENTITY_MODE:-}" in
      user)  _vrg_role='user';        _vrg_role_c='%F{green}' ;;
      audit) _vrg_role='audit';       _vrg_role_c='%F{214}'   ;;  # amber
      admin) _vrg_role='admin';       _vrg_role_c='%F{red}'   ;;  # future
      *)     _vrg_role='no-identity'; _vrg_role_c='%F{red}'   ;;  # uncredentialed
    esac
    PROMPT="[role=${_vrg_role_c}${_vrg_role}%f %~]"$'\n'"$ "
    ZSHRC

    # Identity-mode export for zsh (issue #148). VRG_IDENTITY_MODE is the
    # fast Layer-1 signal that the identity-aware wrappers (vrg-git, vrg-gh,
    # vrg-submit-pr) and skill preflights read; the durable source of truth
    # is ~/.config/vergil/identity-mode, written per-VM at credential-
    # injection time. Export it from ~/.zshenv, NOT ~/.bashrc: this VM's
    # shell is zsh (chsh above), which never sources ~/.bashrc, and ~/.zshenv
    # is the one zsh hook sourced for EVERY invocation — interactive,
    # non-interactive, login, and non-login — so a `zsh -c` command sees the
    # same value an interactive session does. The file-presence guard makes
    # the line a no-op until the mode file is injected, so it is safe to bake
    # into the uncredentialed image. The truly shell-less path (Claude Code
    # spawned directly by sshd, SHLVL=0) sources no rc at all; there identity
    # must come from the resolver's mode-file fallback
    # (vergil_tooling.lib.identity_mode.current_mode()), never this env var.
    cat > "$HOME/.zshenv" << 'ZSHENV'
    [ -f ~/.config/vergil/identity-mode ] && export VRG_IDENTITY_MODE="$(cat ~/.config/vergil/identity-mode)"
    ZSHENV

    # First-boot completion marker for this user-phase step (#177), stamped
    # LAST so a partial run re-runs next boot.
    mkdir -p "$HOME/.vergil"
    touch "$HOME/.vergil/provisioned.uv"

# --- Rootless buildkit for `nerdctl build` (issue #97) ----------------------
# Lima's nerdctl-full bundle (pulled via `containerd: {user: true}`) already
# ships buildkitd/buildctl — the gap is that nothing starts the daemon. Use
# upstream's own containerd-rootless-setuptool.sh to install and start the
# rootless buildkit systemd --user unit (rootless OCI worker). It exposes the
# default socket nerdctl auto-probes, so `nerdctl build` needs no
# --buildkit-host wiring. Lingering is already enabled by Lima's containerd
# setup, so the unit survives logout and reboot.
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"

    # install-buildkit requires the rootless containerd user service to exist
    # already (Lima provisions it via its own containerd setup). Wait for it
    # rather than depend on provisioning-step ordering.
    timeout 300 bash -c 'until systemctl --user is-active --quiet containerd; do sleep 3; done'

    containerd-rootless-setuptool.sh install-buildkit

# --- Per-repo VM profile layering (issue #99, #105) ------------------------
# Declarative tooling install, owned by this (reviewed) template — repos supply
# data, never a script. Stamp the fingerprint, register declared apt repos, install
# the additive apt packages, then install declared vagrant plugins for the Lima user.
# Every step is a no-op when its param is empty, so the base box is unaffected.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    # First-boot-only (#177): skip the per-repo profile install (apt repos,
    # extra packages, vagrant plugins) on every boot after the first. Marker
    # stamped LAST so a failed install re-runs next boot.
    if [ -f /etc/vergil/provisioned.profile ]; then exit 0; fi

    mkdir -p /etc/vergil
    printf '%s\n' '{{.Param.SPEC_FINGERPRINT}}' > /etc/vergil/vm-spec.fingerprint

    # Extra apt repositories: each record is "name|key_url|uri|suite|components";
    # records are ";"-separated. Keys are expected ASCII-armored (gpg --dearmor).
    REPOS="{{.Param.APT_REPOS}}"
    if [ -n "$REPOS" ]; then
      IFS=';' read -ra _repos <<< "$REPOS"
      for _r in "${_repos[@]}"; do
        IFS='|' read -r _name _key _uri _suite _comp <<< "$_r"
        curl -fsSL "$_key" | gpg --dearmor -o "/usr/share/keyrings/${_name}.gpg"
        echo "deb [signed-by=/usr/share/keyrings/${_name}.gpg] $_uri $_suite $_comp" \
          > "/etc/apt/sources.list.d/${_name}.list"
      done
    fi

    PKGS="{{.Param.EXTRA_PACKAGES}}"
    if [ -n "$PKGS" ]; then
      apt-get update
      # Per-package resolution diagnostics (issue #130): apt transactions are
      # all-or-nothing, so a single uninstallable package zeroes the WHOLE
      # extra-package layer and the real cause drowns in apt output (vagrant
      # on arm64 took down 13 installable packages with it). Check every
      # declared package has an installation candidate for this architecture
      # first, and fail naming exactly the offenders. The error lands in
      # /etc/vergil/provision-error, which the readiness probe's hint names.
      MISSING=""
      for _pkg in $PKGS; do
        if [ -z "$(apt-cache madison "$_pkg")" ]; then
          MISSING="${MISSING} ${_pkg}"
        fi
      done
      if [ -n "$MISSING" ]; then
        printf 'ERROR: no installation candidate on %s for:%s (declared in the repo vergil.toml [vm] packages)\n' \
          "$(dpkg --print-architecture)" "${MISSING}" \
          | tee /etc/vergil/provision-error >&2
        exit 1
      fi
      # shellcheck disable=SC2086  # word-splitting the package list is intended
      apt-get install -y --no-install-recommends $PKGS
    fi

    # Vagrant plugins compile native extensions (build deps come via EXTRA_PACKAGES)
    # and must belong to the Lima user who runs vagrant, not root. `sudo -u … -H`
    # points HOME at the user so plugins land in their ~/.vagrant.d.
    #
    # The template owns the vagrant binary itself (issue #130): vagrant has no
    # apt installation candidate on arm64 from ANY source — HashiCorp's repo
    # publishes no arm64 vagrant, and noble dropped it from universe post-BUSL
    # — so the only supported Linux/arm64 path is HashiCorp's Ruby gem.
    # Consuming repos declare plugins plus the build deps (ruby-dev, gcc,
    # make, pkg-config) in packages; "vagrant" never belongs in the apt list.
    PLUGINS="{{.Param.VAGRANT_PLUGINS}}"
    if [ -n "$PLUGINS" ]; then
      if ! command -v vagrant >/dev/null 2>&1; then
        if ! command -v gem >/dev/null 2>&1; then
          printf 'ERROR: vagrant_plugins declared but ruby/gem is unavailable — declare ruby-dev (plus gcc, make, pkg-config) in the repo vergil.toml [vm] packages\n' \
            | tee /etc/vergil/provision-error >&2
          exit 1
        fi
        gem install vagrant
      fi
      for _p in $PLUGINS; do
        # Idempotency guard (#177): `vagrant plugin install` contacts
        # gems.hashicorp.com on every invocation, even when the plugin is
        # already present. This block is a cloud-init per-boot runpart, so an
        # unconditional install re-hit the gem source on the cycle-ssh reboot
        # and a transient timeout there aborted the boot under `set -e`
        # (cloud-init status: error → cycle-ssh failed the whole rebuild). The
        # plugin list is read locally from ~/.vagrant.d — no network — so the
        # steady state (plugin already installed) now makes zero network calls.
        if sudo -u "{{.User}}" -H vagrant plugin list 2>/dev/null \
             | grep -q "^${_p} "; then
          continue
        fi
        # Genuine first install. Retry with backoff to ride out a brief gem
        # source hiccup; tolerate the attempts failing (the post-check below is
        # the real gate) so a transient blip warns instead of aborting the boot.
        for _try in 1 2 3; do
          if sudo -u "{{.User}}" -H vagrant plugin install "$_p"; then
            break
          fi
          echo "WARNING: vagrant plugin install '$_p' attempt ${_try}/3 failed; retrying" >&2
          sleep $(( _try * 5 ))
        done
        # A still-absent plugin after the retries is a real failure, not a
        # transient refresh blip — abort loudly rather than ship a VM missing
        # its declared plugin (no-silent-failures).
        if ! sudo -u "{{.User}}" -H vagrant plugin list 2>/dev/null \
              | grep -q "^${_p} "; then
          printf 'ERROR: vagrant plugin "%s" could not be installed after 3 attempts — gems.hashicorp.com unreachable? (declared in the repo vergil.toml [vm] vagrant_plugins)\n' \
            "$_p" | tee /etc/vergil/provision-error >&2
          exit 1
        fi
      done
    fi

    # Keep the apt lists cache (see the base-tools step): the wipe only forced
    # a full re-download on the next boot (#177).
    apt-get clean

    # Stamp the profile completion marker LAST, only after the install above
    # succeeded (#177).
    touch /etc/vergil/provisioned.profile

# --- Libvirt/KVM group membership (issue #137) -------------------------------
# A profile that declares the libvirt stack leaves the Lima user unable to use
# it: the `libvirt` group gates the qemu:///system socket (vagrant-libvirt's
# default URI) and the `kvm` group gates /dev/kvm once nested virt exposes it.
# The vm-spec schema has no way to express group membership, so derive the
# intent from what the profile already declares — libvirt-daemon-system in
# packages, vagrant-libvirt in vagrant_plugins, or nested = true — and add the
# memberships here. Consuming repos stay declarative; profiles without the
# libvirt stack get no new memberships. Runs after profile layering so the
# libvirt group created by the package postinst already exists; a missing
# group is created rather than silently skipped. The marker records the
# decision for the in-guest test suite (tests/test_libvirt_groups.sh), which
# asserts the contract in both directions.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    PKGS="{{.Param.EXTRA_PACKAGES}}"
    PLUGINS="{{.Param.VAGRANT_PLUGINS}}"
    NESTED="{{.Param.NESTED_VIRT}}"

    WANTED=false
    case " ${PKGS} " in *" libvirt-daemon-system "*) WANTED=true ;; esac
    case " ${PLUGINS} " in *" vagrant-libvirt "*) WANTED=true ;; esac
    if [ "${NESTED}" = "true" ]; then WANTED=true; fi

    mkdir -p /etc/vergil
    printf '%s\n' "${WANTED}" > /etc/vergil/libvirt-groups.requested

    if [ "${WANTED}" = "true" ]; then
      getent group libvirt >/dev/null || groupadd --system libvirt
      getent group kvm >/dev/null || groupadd --system kvm
      usermod -aG libvirt,kvm "{{.User}}"
    fi

# --- Time: chrony with makestep + NTP authority for nested guests (issue #187)
# Two jobs, both platform-general (every nested-virt repo hits the same skew):
#
#   1. Clock reliability (ALL VMs). chrony with `makestep 1.0 -1` STEPS the
#      clock for any offset over a second, at ANY time — not just the first few
#      updates, and not timesyncd's slow slew that never catches a large jump.
#      A laptop suspend can leave the VM's wall clock hours off long after boot
#      (stock timesyncd sat on a ~65-min skew while still reporting synced);
#      chrony steps it back within a poll on resume. Safe for clustered guests:
#      corosync's membership timers and DRBD use CLOCK_MONOTONIC, unaffected by
#      a wall-clock step — only log timestamps move, which is exactly the thing
#      we want corrected. timesyncd is masked here so the two never duel.
#
#   2. NTP authority for nested libvirt guests (VMs that declare the libvirt
#      stack — same signal as the group block above). chrony SERVES NTP on the
#      private ranges libvirt host-only networks draw from, so a nested guest
#      pointed at the host's gateway address on its bridge (e.g. 10.50.0.1)
#      syncs to it. `local stratum 10` keeps the host a valid source even fully
#      offline, so the nested fleet stays internally consistent with no upstream
#      — agreement across the fleet matters more than absolute accuracy. Gated,
#      not default-on: a base VM with no nested guests must not open the NTP
#      server port (service-surface minimization, #78). The `allow` ranges are
#      generic (the template never sees a VM's declared subnets), which is why
#      this stays entirely template-side — no per-VM rendering in tooling.
#
# Runs every boot (not first-boot-only): the install is in the base block, but
# the config + serving decision are cheap and must track the current profile,
# like the group/nested/port-forward blocks. The marker records the serving
# decision for the in-guest test suite (tests/test_time.sh).
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    PKGS="{{.Param.EXTRA_PACKAGES}}"
    PLUGINS="{{.Param.VAGRANT_PLUGINS}}"
    NESTED="{{.Param.NESTED_VIRT}}"

    # Same libvirt-stack signal the group block derives: a VM that hosts nested
    # libvirt guests is the natural NTP authority for them.
    SERVE=false
    case " ${PKGS} " in *" libvirt-daemon-system "*) SERVE=true ;; esac
    case " ${PLUGINS} " in *" vagrant-libvirt "*) SERVE=true ;; esac
    if [ "${NESTED}" = "true" ]; then SERVE=true; fi

    mkdir -p /etc/vergil
    printf '%s\n' "${SERVE}" > /etc/vergil/ntp-server.requested

    # Base config — clock reliability for every Vergil VM. Heredoc body and
    # terminator sit at the YAML block base indent (flush-left after dedent), so
    # they land at column 0 in the executed script (cf. the heredocs above).
    cat > /etc/chrony/chrony.conf <<'CHRONY'
    # Managed by vergil-vm (issue #187) — do not hand-edit; rebuild the VM.

    # Upstream discipline when reachable (Ubuntu's default pool; no new trust).
    pool ntp.ubuntu.com iburst maxsources 4

    # Step the clock for any offset over 1s, at ANY time (the -1 = unlimited,
    # not just the first N updates) so a post-boot suspend jump self-corrects.
    makestep 1.0 -1

    # Hold a good estimate between syncs / across reboots, and discipline the RTC.
    driftfile /var/lib/chrony/chrony.drift
    rtcsync
    CHRONY

    # NTP authority for nested guests — appended only for libvirt-stack VMs.
    if [ "${SERVE}" = "true" ]; then
      cat >> /etc/chrony/chrony.conf <<'CHRONY_SERVE'

    # Serve NTP to nested libvirt guests. The template can't know a VM's
    # declared host-only subnets, so allow the RFC1918 ranges those networks
    # draw from; the host's gateway address on each bridge is a valid server
    # once chrony listens here. Time-only — no other surface is exposed.
    allow 10.0.0.0/8
    allow 172.16.0.0/12
    allow 192.168.0.0/16

    # Stay a valid source with no upstream reachable, so the nested fleet stays
    # internally consistent offline (agreement beats absolute accuracy).
    local stratum 10
    CHRONY_SERVE
    fi

    # chrony owns the clock — mask AND stop timesyncd so the two daemons never
    # duel (acceptance #4). `--now` closes the window where a running timesyncd
    # lingers after masking. `mask` is not allowed to fail silently: timesyncd
    # ships on this image, so a failure is a real anomaly — let set -e abort.
    if systemctl cat systemd-timesyncd.service >/dev/null 2>&1; then
      systemctl mask --now systemd-timesyncd.service
    fi

    # Apply the config. enable --now is idempotent; restart picks up a changed
    # conf on later boots. A failure here means the box would ship with the
    # clock undisciplined — abort loudly rather than ship it (no silent failure).
    systemctl enable chrony
    systemctl restart chrony

# --- Nested-virtualization verification (issue #131) -------------------------
# When the composed spec requests nested virt, vrg-vm sets both the top-level
# `nestedVirtualization` flag and the NESTED_VIRT param (see the param block).
# Verify the request actually produced /dev/kvm: without it, anything that
# needs KVM falls back to TCG software emulation — a silent order-of-magnitude
# slowdown the no-silent-failures policy forbids. Fail the build loudly
# instead. The marker records the request for the in-guest test suite
# (tests/test_nested_virt.sh), which asserts the contract in both directions.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    NESTED="{{.Param.NESTED_VIRT}}"
    mkdir -p /etc/vergil
    printf '%s\n' "${NESTED:-false}" > /etc/vergil/nested-virt.requested
    if [ "${NESTED}" = "true" ] && [ ! -c /dev/kvm ]; then
      # tee into provision-error so the failure is named at the start
      # boundary (issue #130), not just buried in the cloud-init log.
      printf '%s\n' \
        "ERROR: nested virtualization was requested (NESTED_VIRT=true) but" \
        "/dev/kvm is absent in the guest. The host must be macOS 15+ on" \
        "M3-or-later Apple silicon, and the instance must be created with" \
        "nestedVirtualization=true (vrg-vm sets both halves together)." \
        | tee /etc/vergil/provision-error >&2
      exit 1
    fi

# --- Port-forward relays (issue #170) ---------------------------------------
# Relay a VM port to a service reachable from inside the Lima VM — typically a
# nested libvirt guest (e.g. an observability Grafana at 10.50.0.2:3000) that
# Lima's own port-forwarding cannot see: Lima's guest agent only observes ports
# in the Lima VM's network namespace, not a nested guest's. The fix is a relay
# that listens on the Lima VM's 0.0.0.0:<port> and proxies to <to>; that
# 0.0.0.0 bind is what Lima auto-forwards to the Mac's localhost (verified —
# limactl binds 127.0.0.1:<port> on the host with no config change or restart).
#
# Each entry becomes a socket-activated systemd-socket-proxyd relay (ships with
# systemd — no extra packages): a .socket binding 0.0.0.0:<port> and a matching
# .service that proxies accepted connections to <to>. systemd keeps it alive
# across reboots; a down guest yields a passed-through connection refusal
# (transparent). PORT_FORWARDS is ";"-joined "port|host:port" records; empty
# leaves the base box untouched. The marker records the declared-forward count
# for the in-guest test suite (tests/test_port_forwards.sh).
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail

    mkdir -p /etc/vergil
    FORWARDS="{{.Param.PORT_FORWARDS}}"

    if [ -z "$FORWARDS" ]; then
      printf '0\n' > /etc/vergil/port-forwards.requested
      exit 0
    fi

    IFS=';' read -ra _fwds <<< "$FORWARDS"
    printf '%s\n' "${#_fwds[@]}" > /etc/vergil/port-forwards.requested

    for _f in "${_fwds[@]}"; do
      IFS='|' read -r _port _to <<< "$_f"
      if ! printf '%s' "$_port" | grep -qE '^[0-9]+$' || [ -z "$_to" ]; then
        printf 'ERROR: malformed port_forwards entry "%s" — expected "<port>|<host:port>" (declared in the repo vergil.toml [vm] port_forwards)\n' \
          "$_f" | tee /etc/vergil/provision-error >&2
        exit 1
      fi
      _unit="vergil-portforward-${_port}"
      # Heredoc bodies/terminators sit at the YAML block-scalar base indent (4
      # spaces) — flush-left after dedent — so the unit-file lines and the
      # terminators land at column 0 in the executed script (cf. the
      # managed-settings.json heredoc above). A less-indented line would end the
      # YAML block; a non-column-0 terminator would never close the heredoc.
      cat > "/etc/systemd/system/${_unit}.socket" <<SOCKET
    [Unit]
    Description=Vergil port-forward relay socket (:${_port} -> ${_to})

    [Socket]
    ListenStream=0.0.0.0:${_port}

    [Install]
    WantedBy=sockets.target
    SOCKET
      cat > "/etc/systemd/system/${_unit}.service" <<SERVICE
    [Unit]
    Description=Vergil port-forward relay (:${_port} -> ${_to})
    Requires=${_unit}.socket
    After=${_unit}.socket

    [Service]
    ExecStart=/usr/lib/systemd/systemd-socket-proxyd ${_to}
    SERVICE
      # Enable (boot persistence) and start now. A port already in use makes
      # the socket start fail; set -e then aborts the build loudly (issue #130)
      # rather than shipping a VM whose declared forward never bound.
      if ! systemctl enable --now "${_unit}.socket"; then
        printf 'ERROR: port-forward relay for :%s failed to start (port already in use?)\n' \
          "$_port" | tee /etc/vergil/provision-error >&2
        exit 1
      fi
    done

probes:
- mode: readiness
  description: "provisioning completed, core tools installed, containerd and buildkit running"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export PATH="$HOME/.local/bin:$PATH"
    # Readiness means ALL provisioning finished cleanly, not merely "the base
    # tools answer" (issue #130): the extra-package layer runs after the tools
    # this probe used to wait for, so a failed profile layer previously
    # slipped through as a ready VM that silently lacked its declared
    # toolchain. Gate on cloud-init reaching a clean "done", and bail out
    # immediately when provisioning has recorded a failure — those tools are
    # never coming, so spinning out the timeout would only bury the error.
    timeout 1800 bash -c '
      until cloud-init status 2>/dev/null | grep -q "^status: done" &&
            command -v gh >/dev/null 2>&1 &&
            command -v uv >/dev/null 2>&1 &&
            command -v claude >/dev/null 2>&1 &&
            pgrep -f containerd >/dev/null 2>&1 &&
            pgrep -f buildkitd >/dev/null 2>&1; do
        if [ -f /etc/vergil/provision-error ]; then exit 1; fi
        if cloud-init status 2>/dev/null | grep -q "^status: error"; then exit 1; fi
        sleep 5
      done
    '
  hint: |
    Provisioning may have failed. Check the named error first, then the full log:
      vrg-vm session . -- cat /etc/vergil/provision-error
      vrg-vm session . -- cat /var/log/cloud-init-output.log

message: |
  vergil-agent VM is ready.

  Projects mount: /projects

  Shell into the VM:
    vrg-vm session . -- bash

  Run nerdctl:
    vrg-vm session . -- nerdctl run --rm alpine echo hello

  Launch Claude Code (workspace is relative to the projects dir):
    vrg-vm session <org>/<repo>

  Update vergil-tooling:
    vrg-vm update
