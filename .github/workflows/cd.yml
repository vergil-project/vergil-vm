name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  # Needed because the release job calls cd-release.yml@v2.1, whose CI-evidence
  # harvest downloads the release PR's artifacts; a reusable workflow cannot
  # request more permission than its caller grants.
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    # The automation App's credentials let the shared docs workflow report
    # its failures as issues in the operations queue (epic
    # vergil-project/.github#1494). They live in the `automation` environment,
    # which reaches a reusable workflow only through `secrets: inherit` (epic
    # vergil-project/.github#1384).
    secrets: inherit

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      container-suffix: base
    # The automation App's installation token pushes the release tag (epic
    # vergil-project/.github#1350); tag protection lets only the App and
    # admins create release tags. The App keys live in the `automation`
    # environment, which reaches a reusable workflow only through
    # `secrets: inherit` (epic vergil-project/.github#1384).
    secrets: inherit
