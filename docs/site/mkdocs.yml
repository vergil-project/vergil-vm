site_name: Vergil VM
site_description: Lima VM definitions for isolated Vergil agent execution environments
repo_url: https://github.com/vergil-project/vergil-vm
repo_name: vergil-project/vergil-vm

docs_dir: docs
strict: true
edit_uri: ""

extra:
  version:
    provider: mike
extra_css:
  - stylesheets/extra.css

plugins:
  - search

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Releases:
      - Changelog: changelog.md
      - Release Notes:
          - releases/index.md
  - Getting Started: getting-started.md
  - Sessions: sessions.md
  - Architecture:
      - architecture/index.md
      - Design Decisions:
          - VM Isolation Model: architecture/decisions/vm-isolation-model.md
          - Credential Injection: architecture/decisions/credential-injection.md
          - Off-Platform GCP Modules: architecture/decisions/off-platform-gcp-modules.md
  - Operations:
      - Build and Test: operations/build-and-test.md
      - Resource Tuning: operations/resource-tuning.md
      - Troubleshooting: operations/troubleshooting.md
